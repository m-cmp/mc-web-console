<!-- 공통 비밀값 모달: node detail의 Keypair(private key)·CSP 임시자격증명 표시용 -->
<!-- 값은 secretmodal.js가 메모리에만 들고 있다가 모달이 닫히면 지운다. 기본은 가려서 표시한다. -->
<div class="modal modal-blur fade" id="secretModal" tabindex="-1" style="display: none;" aria-hidden="true" aria-labelledby="secretModal-title">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="secretModal-title">Secret</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="secretModal-loading" class="d-none text-center py-4">
          <div class="spinner-border text-secondary" role="status"></div>
          <div class="text-muted small mt-2" id="secretModal-loading-text">Loading...</div>
        </div>
        <div id="secretModal-error" class="alert alert-danger d-none" role="alert"></div>
        <div id="secretModal-notice" class="alert alert-info d-none" role="note"></div>
        <div id="secretModal-warning" class="alert alert-warning d-none" role="alert"></div>
        <dl id="secretModal-meta" class="row mb-3 d-none"></dl>
        <div id="secretModal-toolbar" class="d-flex align-items-center gap-2 mb-2 d-none">
          <span class="text-muted small">Values are hidden by default.</span>
          <div class="ms-auto d-flex gap-2" id="secretModal-actions">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="secretModal-toggle-btn"
              onclick="webconsolejs['partials/operation/manage/secretmodal'].toggleSecrets()">Show</button>
          </div>
        </div>
        <div id="secretModal-fields"></div>
        <div id="secretModal-empty" class="text-muted d-none">Not available</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="secretModal-close-btn">Close</button>
      </div>
    </div>
  </div>
</div>
