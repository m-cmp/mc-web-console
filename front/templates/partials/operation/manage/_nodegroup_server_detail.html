<div class="container">
  <div class="row">
    <!-- 왼쪽 열 -->
    <div class="col-lg-6">
      <div class="datagrid">
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Node ID</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_server_id"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Node Status</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_server_status"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Node Spec</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_server_spec"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Public DNS(IPv4)</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_public_dns"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Public IP(IPv4)</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_public_ip"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Region</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_region"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Zone</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_zone"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Security Group</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_security_group_text"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Private DNS</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_private_dns"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Private IP</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_private_ip"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Image ID</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_image_id"></div>
        </div>
      </div>
    </div>
    
    <!-- 오른쪽 열 -->
    <div class="col-lg-6">
      <div class="datagrid">
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Platform</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_archi"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Operating System</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_os"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">VPC ID</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_vpc_id"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Subnet ID</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_subnet_id"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Network Interface</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_eth"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Root Device Type</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_root_device_type"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Root Device</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_root_device"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Block Device</div>
          <div class="datagrid-content" id="nodegroup_block_device_section"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Keypair Name</div>
          <a href="#" role="button"
          onclick="event.preventDefault(); webconsolejs['pages/operation/manage/infraworkloads'].getKeypair(this, 'nodegroup')"
          title="Show the private key of this keypair"
          id="nodegroup_server_detail_view_keypair_name" class="badge badge-outline text-secondary fw-normal badge-pill"></a>
        </div>
        <!-- 내 워크스페이스 역할에 이 노드 CSP의 CSP Role 매핑이 설정된 경우에만 표시 (infraworkloads.js updateCspCredentialVisibility) -->
        <div class="datagrid-item mb-3 d-none" id="nodegroup_server_detail_view_csp_credential_item">
          <div class="datagrid-title">CSP Credential</div>
          <div class="datagrid-content">
            <button type="button" class="btn btn-sm btn-outline-primary"
              id="nodegroup_server_detail_view_csp_credential_btn"
              title="Issue temporary credentials for this node's CSP with the CSP role mapped to your workspace role"
              onclick="webconsolejs['pages/operation/manage/infraworkloads'].getCspCredential('nodegroup')">
              Get CSP Credential
            </button>
          </div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">Access ID / Pwd</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_access_id_pass"></div>
        </div>
        <div class="datagrid-item mb-3">
          <div class="datagrid-title">User ID / Pwd</div>
          <div class="datagrid-content" id="nodegroup_server_detail_view_user_id_pass"></div>
        </div>
      </div>
    </div>
  </div>
</div>
