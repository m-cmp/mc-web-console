<div class="card bg-secondary-lt">
  <div class="card-header">
    <h3 class="card-title">
      NodeGroup List / Status
    </h3>
    <div class="card-actions btn-actions">

      <!-- Action -->
      <div class="dropdown">
        <a href="#" class="btn-action" data-bs-toggle="dropdown">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M6 9l6 6l6 -6" />
          </svg>
        </a>
        <div
          class="dropdown-menu dropdown-menu-end dropdown-menu-arrow"
        >
          <a
            class="dropdown-item"
            data-bs-toggle="modal"
            data-bs-target="#commonDefaultModal"
            onclick="webconsolejs['partials/layout/modal'].commonModal(this,'NodeGroupDelete', 'Would you like to delete NodeGroup ?', 'pages/operation/manage/k8sworkloads.deleteNodeGroup')"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="icon dropdown-item-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
              <path d="M4 7l16 0"></path>
              <path d="M10 11l0 6"></path>
              <path d="M14 11l0 6"></path>
              <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"></path>
              <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"></path>
            </svg>
            Delete
          </a>

          <div class="dropdown-divider"></div>

          <a
            class="dropdown-item"
            id="nodegroup-edit-scaling-item"
            onclick="webconsolejs['pages/operation/manage/k8sworkloads'].openEditScalingModal()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="icon dropdown-item-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
              <path d="M8 8m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path>
              <path d="M16 16m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path>
              <path d="M8 4h8a4 4 0 0 1 0 8h-8a4 4 0 0 0 0 8"></path>
            </svg>
            Edit Scaling
          </a>

          <div class="dropdown-divider"></div>

          <a
            class="dropdown-item"
            onclick="webconsolejs['pages/operation/manage/k8sworkloads'].exportNodeGroups()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="icon dropdown-item-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
              <path
                d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"
              ></path>
              <path d="M7 11l5 5l5 -5"></path>
              <path d="M12 4l0 12"></path>
            </svg>
            Export to JSON
          </a>
          <a
            class="dropdown-item"
            onclick="document.getElementById('import-nodegroups-file').click()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="icon dropdown-item-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
              <path
                d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"
              ></path>
              <path d="M7 9l5 -5l5 5"></path>
              <path d="M12 4l0 12"></path>
            </svg>
            Import from JSON
          </a>
        </div>
      </div>

      <!-- refresh -->
      <a class="btn-action"
        onclick="webconsolejs['pages/operation/manage/k8sworkloads'].getSelectedPmkData()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-refresh"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
          <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
        </svg>
      </a>
      <!-- add nodegroup -->
      <a
        class="btn btn-outline-primary disabled"
        style="pointer-events: none;"
        title="Please select an Active cluster first"
        onclick="webconsolejs['partials/operation/manage/clustercreate'].addNewNodeGroup()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
          <path d="M12 5l0 14"></path>
          <path d="M5 12l14 0"></path>
        </svg>
        Add NodeGroup
      </a>

    </div>
  </div>
  <div class="card-body">
    <div>
      <ul class="vmStatus-list" id="pmk_nodegroup_info_box"></ul>
    </div>
  </div>

  <!-- Import from JSON: hidden file picker -->
  <input
    type="file"
    id="import-nodegroups-file"
    accept=".json"
    style="display: none"
    onchange="webconsolejs['pages/operation/manage/k8sworkloads'].importNodeGroups(this)"
  />
</div>

<!-- Edit Scaling modal (autoscaling on/off + node sizes) -->
<div
  class="modal modal-blur fade"
  id="nodegroup-scaling-modal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Scaling</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">NodeGroup</label>
          <input
            type="text"
            class="form-control"
            id="ng-scaling-name"
            readonly
          />
          <small class="form-hint" id="ng-scaling-current"></small>
        </div>

        <div class="mb-2">
          <label class="form-label required">Desired Node Count</label>
          <div class="row g-2">
            <div class="col-md-6">
              <div class="input-number-container" id="ng-scaling-desired-stepper">
                <button
                  class="input-number-decrement"
                  type="button"
                  id="ng-scaling-desired-dec"
                >-</button>
                <input
                  type="number"
                  min="0"
                  class="input-number"
                  id="ng-scaling-desired"
                />
                <button
                  class="input-number-increment"
                  type="button"
                  id="ng-scaling-desired-inc"
                >+</button>
              </div>
            </div>
          </div>
          <small class="form-hint" id="ng-scaling-desired-note" style="display: none"></small>
        </div>

        <div class="mb-2">
          <label class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="ng-scaling-enabled" />
            <span class="form-check-label">Enable autoscaling</span>
          </label>
          <small class="form-hint text-warning" id="ng-scaling-hint" style="display: none"></small>
        </div>

        <div class="mb-2" id="ng-scaling-range" style="display: none">
          <label class="form-label required">Min / Max Node Count</label>
          <div class="row g-2">
            <div class="col-6">
              <input
                type="number"
                min="0"
                class="form-control"
                id="ng-scaling-min"
                placeholder="Min"
              />
            </div>
            <div class="col-6">
              <input
                type="number"
                min="0"
                class="form-control"
                id="ng-scaling-max"
                placeholder="Max"
              />
            </div>
          </div>
        </div>

        <div class="mt-3" id="ng-scaling-plan"></div>

        <div class="alert alert-warning mt-2" id="ng-scaling-confirm" style="display: none">
          <div class="fw-bold" id="ng-scaling-confirm-title"></div>
          <div id="ng-scaling-confirm-text"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-link link-secondary"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>
        <button
          type="button"
          id="ng-scaling-submit-btn"
          class="btn btn-primary"
          onclick="webconsolejs['pages/operation/manage/k8sworkloads'].applyEditScaling()"
        >
          Apply
        </button>
      </div>
    </div>
  </div>
</div>
